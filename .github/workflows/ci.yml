name: Veyzo Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek (Checkout)
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Derleme ve Format Kontrolu (Testleri Atla)
        run: chmod +x mvnw && ./mvnw clean compile -DskipTests